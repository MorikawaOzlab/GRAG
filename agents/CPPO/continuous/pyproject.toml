[project]
name = "mava-jaxgcrl"
version = "0.1.0"
description = "Mava-port of JaxGCRL — CPPO + CRL + PPO on Brax / MuJoCo, Hydra-driven."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pip>=25.0.1",
  "jax==0.4.25",
  "jaxlib==0.4.25+cuda12.cudnn89; platform_system == 'Linux'",
  "nvidia-cudnn-cu12==8.9.7.29; platform_system == 'Linux'",
  "nvidia-cuda-cupti-cu12>=12.4; platform_system == 'Linux'",
  "nvidia-cuda-runtime-cu12; platform_system == 'Linux'",
  "nvidia-cuda-nvcc-cu12; platform_system == 'Linux'",
  "nvidia-cusolver-cu12>=11.7.3.90; platform_system == 'Linux'",
  "nvidia-cufft-cu12; platform_system == 'Linux'",
  "nvidia-curand-cu12; platform_system == 'Linux'",
  "nvidia-nccl-cu12; platform_system == 'Linux'",
  "jaxlib==0.4.25; platform_system != 'Linux'",
  "flax>=0.8.3",
  "brax==0.12.1",
  "matplotlib==3.8.4",
  "mujoco==3.2.7",
  "mujoco-mjx==3.2.7",
  "numpy<2",
  "scipy>=1.12",
  "tyro>=0.9.16",
  "wandb",
  "wandb-osh",
  "hydra-core>=1.3,<2",
  "hydra-optuna-sweeper>=1.2",
  "omegaconf>=2.3",
  "colorama",
  "rich",
  "id-marl-eval",
  "neptune",
  "tensorboard_logger",
  "etils[epath]",
  "pandas<3",
]

[tool.uv]
find-links = [ "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html" ]

[tool.uv.extra-build-dependencies]
pandas = [{ requirement = "setuptools<70", match-runtime = false }]

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jaxgcrl*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"jaxgcrl.envs" = ["**/assets/*"]
"mava.configs" = ["**/*.yaml"]
