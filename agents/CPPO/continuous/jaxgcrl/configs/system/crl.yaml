
policy_lr: 6e-4
critic_lr: 3e-4
alpha_lr: 3e-4
batch_size: 256

discounting: 0.99
logsumexp_penalty_coeff: 0.1

max_replay_size: 10000
min_replay_size: 1000
unroll_length: 128

# Network 
h_dim: 512
n_hidden: 4
skip_connections: 4
use_relu: false
use_ln: true
repr_dim: 64

# Contrastive 
contrastive_loss_fn: sym_infonce
energy_fn: l2
