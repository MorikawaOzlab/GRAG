
seed: 1

total_timesteps: ~
num_updates: 500

# Rollout / replay
rollout_length: 64
explore_steps: 1000
buffer_size: 5000
batch_size: 256

# Learning rate
q_lr: 3e-4
max_grad_norm: 0.5

# RL
gamma: 0.999

# Epsilon-greedy: linear decay from eps_start to eps_min over eps_decay env steps
eps_start: 1.0
eps_min: 0.05
eps_decay: 50000

# Contrastive critic
rep_size: 64
energy_fn: "norm"
energy_eps: 1e-6
contrastive_loss_fn: "fwd_infonce"
logsumexp_penalty_coeff: 0.1

# Set at runtime by learner_setup
obs_size: ~
action_size: ~
