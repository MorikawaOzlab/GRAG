#  FF-ICRL-JaxNav System Config 
# Off-policy SAC-style CRL for JaxNav (continuous action, goal-conditioned).

use_icrl: true

# Seed
total_timesteps: ~
num_updates: 1250
seed: 42

# Training steps
update_batch_size: 1
add_agent_id: false
rollout_length: 128

# Buffer
explore_steps: 1000
buffer_size: 5000
batch_size: 256

# Learning rates
policy_lr: 3e-4
q_lr: 3e-4
alpha_lr: 3e-4
max_grad_norm: 0.5

# Algorithm
gamma: 0.99

# SAC entropy tuning
target_entropy_scale: 1.0
init_alpha: 0.1

# Network
rep_size: 64
log_std_min: -5.0
log_std_max: 2.0

# CRL
logsumexp_penalty_coeff: 0.1

icrl:
  learnable_temperature: true
