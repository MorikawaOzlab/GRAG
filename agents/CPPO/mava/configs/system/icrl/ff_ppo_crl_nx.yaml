
seed: 1

total_timesteps: ~
num_updates: 1250

update_batch_size: 1

# Rollout and batch sizes
rollout_length: 128
batch_size: 512
ppo_epochs: 1
clip_eps: 0.2
ent_coef: 0.01

# Learning rates
q_lr: 2.5e-4
actor_lr: 2.5e-4
max_grad_norm: 0.5
lr_decay_type: "cosine"
lr_end: 1e-7

# RL
gamma: 0.99
logsumexp_penalty_coeff: 0.1
rep_size: 64
energy_fn: "norm"
contrastive_loss_fn: "fwd_infonce"

# Set at runtime by learner_setup
obs_size: ~
action_size: ~
