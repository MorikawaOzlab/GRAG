# CPPO (Contrastive PPO) Continuous System Config

# Enable ICRL
use_icrl: true

# Budget
total_timesteps: ~ # Set the total environment steps.
num_updates: 1250
seed: 42
update_batch_size: 1
add_agent_id: False

# Rollout / batching
rollout_length: 128
num_epochs: 4
batch_size: 512

# Learning rates
actor_lr: 2.5e-5
q_lr: 3e-4
max_grad_norm: 5.0
lr_linear_decay: false
lr_end: 1e-7

# Algorithm
gamma: 0.9999

# PPO
clip_eps: 0.1
ent_coef: 0.001            # constant entropy bonus

# Monte-Carlo samples for V(s,g) estimation
num_mc_samples: 64

# Contrastive critic 
logsumexp_penalty_coeff: 0.3
rep_size: 64
energy_fn: "l2"
contrastive_loss_fn: "fwd_infonce"

# Actor log_std clipping
log_std_min: -5.0
log_std_max: 0.0

# Goal configuration
icrl:
  goal_type: "distance"
