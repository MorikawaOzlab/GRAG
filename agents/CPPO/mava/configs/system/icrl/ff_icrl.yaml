
use_icrl: true
discrete_actions: true

# Seed
total_timesteps: ~ # Set the total environment steps.
num_updates: 1250 # Number of updates
seed: 42
# Training steps
explore_steps: 1000
update_batch_size: 1
add_agent_id: false 

# Environment steps
rollout_length: 128 # Number of environment steps per vectorised environment.

# Buffer
buffer_size: 5000  
batch_size: 256

# Learning rates
policy_lr: 3e-4
q_lr: 3e-4
alpha_lr: 3e-4
max_grad_norm: 0.5

# Algorithm
gamma: 0.99

# Entropy tuning
autotune: true
target_entropy_scale: 0.89  
init_alpha: 0.1
alpha_min: 0.01  

# ICRL-specific
logsumexp_penalty_coeff: 0.91  
rep_size: 64
energy_fn: "norm"
energy_eps: 1e-6  
contrastive_loss_fn: "fwd_infonce"
win_repeat_steps: 5 

icrl:
  goal_type: "distance_per_agent"
