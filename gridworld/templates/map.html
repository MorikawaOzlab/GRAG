<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マップ作成 | GridWorld Lab</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div><small>GRIDWORLD LAB / 01</small><h1>マップ作成</h1></div><nav><a href="http://127.0.0.1:5001">マップ</a><a href="http://127.0.0.1:5002">環境設定</a><a href="http://127.0.0.1:5003">AI学習</a></nav></header>
<main><p class="lead">大きさを決め、マスをクリックして配置します。新規マップは全マス通常マスです。保存にはスタートとゴールを各1つ置いてください。到達できないゴールも保存できます。</p><div class="layout"><aside>
<section class="card stack"><h2>キャンバス</h2><div class="row"><div class="field"><label for="rows">縦</label><input id="rows" type="number" min="2" max="50" value="8"></div><div class="field"><label for="cols">横</label><input id="cols" type="number" min="2" max="50" value="10"></div></div><button id="resize">新しいマップ</button><p class="hint">作り直すと現在の編集内容は消えます。保存したマップは残ります。</p></section>
<section class="card stack"><h2>ファイル</h2><div class="field"><label for="name">マップ名</label><input id="name" maxlength="100" value="サンプルマップ"></div><button id="save">サーバーに保存</button><div class="field"><label for="map-list">保存済みマップ</label><select id="map-list"></select></div><div class="row"><button id="load" class="secondary">読み込む</button><button id="download" class="secondary">ダウンロード</button></div><div class="field"><label for="upload">JSONをアップロード</label><input id="upload" type="file" accept=".json,application/json"></div><p id="status" class="status" role="status"></p></section>
</aside><section class="card"><h2>編集グリッド</h2><div class="toolbar" id="tools"><button data-tool="wall" class="active">障害物</button><button data-tool="start">スタート</button><button data-tool="goal">ゴール</button><button data-tool="erase">消去</button></div><div class="grid-scroll"><div id="grid" class="grid" role="grid" aria-label="マップ編集"></div></div><div class="legend"><span class="badge"><i class="swatch wall"></i>障害物</span><span class="badge"><i class="swatch start"></i>スタート</span><span class="badge"><i class="swatch goal"></i>ゴール</span></div></section></div></main>
<script>
const $=id=>document.getElementById(id);let map={name:'サンプルマップ',rows:8,cols:10,start:null,goal:null,obstacles:[]},tool='wall';
const same=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];const hasWall=p=>map.obstacles.some(x=>same(x,p));
function message(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error)}
function render(){const grid=$('grid');grid.style.setProperty('--cols',map.cols);grid.replaceChildren();for(let r=0;r<map.rows;r++)for(let c=0;c<map.cols;c++){let p=[r,c],cell=document.createElement('div');cell.className='cell clickable'+(hasWall(p)?' wall':'')+(same(map.start,p)?' start':'')+(same(map.goal,p)?' goal':'');cell.textContent=hasWall(p)?'■':same(map.start,p)?'S':same(map.goal,p)?'G':'';cell.title=`${r+1}行 ${c+1}列`;cell.setAttribute('role','button');cell.tabIndex=0;cell.onclick=()=>place(p);cell.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place(p)}};grid.append(cell)}}
function place(p){if(tool==='start'){map.obstacles=map.obstacles.filter(x=>!same(x,p));if(same(map.goal,p)){message('ゴールと同じマスには置けません。',true);return}map.start=p}else if(tool==='goal'){map.obstacles=map.obstacles.filter(x=>!same(x,p));if(same(map.start,p)){message('スタートと同じマスには置けません。',true);return}map.goal=p}else if(tool==='wall'){if(same(map.start,p)||same(map.goal,p)){message('スタート・ゴールには障害物を置けません。',true);return}if(!hasWall(p))map.obstacles.push(p)}else{map.obstacles=map.obstacles.filter(x=>!same(x,p))}message('');render()}
async function api(url,options){const res=await fetch(url,options);const data=await res.json();if(!res.ok)throw Error(data.error||'処理に失敗しました');return data}
async function refresh(){const maps=await api('/api/maps');$('map-list').replaceChildren();for(const item of maps){const option=new Option(`${item.name} (${item.rows}×${item.cols})`,item.name);$('map-list').add(option)}}
$('tools').onclick=e=>{const button=e.target.closest('button[data-tool]');if(!button)return;tool=button.dataset.tool;document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('active',x===button))};
$('resize').onclick=()=>{const rows=Number($('rows').value),cols=Number($('cols').value);if(!Number.isInteger(rows)||!Number.isInteger(cols)||rows<2||cols<2||rows>50||cols>50){message('縦・横は2〜50にしてください。',true);return}map={name:$('name').value,rows,cols,start:null,goal:null,obstacles:[]};render();message('新しいマップを作成しました')};
$('save').onclick=async()=>{try{map.name=$('name').value.trim();map=await api('/api/maps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(map)});await refresh();$('map-list').value=map.name;message('保存しました')}catch(e){message(e.message,true)}};
$('load').onclick=async()=>{try{const name=$('map-list').value;if(!name)throw Error('保存済みマップを選んでください。');map=await api('/api/maps/'+encodeURIComponent(name));$('name').value=map.name;$('rows').value=map.rows;$('cols').value=map.cols;render();message('読み込みました')}catch(e){message(e.message,true)}};
$('download').onclick=()=>{const name=$('map-list').value;if(!name){message('保存済みマップを選んでください。',true);return}location.href='/api/maps/'+encodeURIComponent(name)+'/download'};
$('upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const form=new FormData();form.append('file',file);map=await api('/api/maps/upload',{method:'POST',body:form});$('name').value=map.name;$('rows').value=map.rows;$('cols').value=map.cols;render();await refresh();$('map-list').value=map.name;message('アップロードして保存しました')}catch(error){message(error.message,true)}e.target.value=''};
render();refresh().catch(e=>message(e.message,true));
</script></body></html>
